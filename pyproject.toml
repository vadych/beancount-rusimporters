[project]
name = "beancount-rusimporters"
version = "0.1.0"
description = "Bank statement importers for Russian banks with TOML-based categorization for Beancount"
readme = "README.md"
authors = [{ name = "Vadych", email = "sisinv@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "beancount>=3.2.3",
    "beangulp>=0.2.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.10",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"
